# Render Blueprint — one click deploy for SkyLine Assist.
# In Render: New + -> Blueprint -> pick this repo -> Apply.
# You will be prompted for GEMINI_API_KEY; everything else is automatic.
#
# The free Postgres that Render provisions expires after 30 days — for a
# permanent free DB paste a Supabase DATABASE_URL into the web service's
# Environment tab afterwards (schema + seed are created automatically on
# startup, no migration step needed).

services:
  - type: web
    name: skyline-assist
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_URL
        fromDatabase:
          name: skyline-assist-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "*"

databases:
  - name: skyline-assist-db
    databaseName: skyline
    plan: free
